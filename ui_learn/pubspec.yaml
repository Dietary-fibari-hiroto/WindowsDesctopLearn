name: ui_learn
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/icons/
    - assets/images/photos/
    - assets/images/elements/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Medium.ttf
          weight: 500
          
    - family: NotoSerifJP
      fonts:
        - asset: assets/fonts/NotoSerifJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifJP-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#000000"
  image: assets/images/icons/ourvibe_logo.png

  android: true

  android_12:
    image: assets/images/icons/ourvibe_logo.png
    icon_background_color: "#000000"


